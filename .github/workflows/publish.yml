name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/scroot/ui/package-lock.json

      # The Review Console (scroot serve) is served from src/scroot/ui/dist,
      # which is git-ignored. It must be built here so it is packaged into the
      # wheel (declared as package-data in pyproject.toml) - otherwise
      # `scroot serve` hits the "UI not built" fallback for pip users.
      - name: Build dashboard UI
        working-directory: src/scroot/ui
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify the UI was packaged into the wheel
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          if not any(n.endswith("ui/dist/index.html") for n in names):
              sys.exit("ERROR: ui/dist/index.html missing from the wheel - the dashboard would not serve.")
          print("OK: dashboard UI present in", whl)
          PY

      - name: Check distribution
        run: |
          pip install twine
          twine check dist/*
          ls -lh dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/scroot/
    permissions:
      id-token: write   # required for Trusted Publisher (OIDC)

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  sbom:
    name: Generate and attach SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to upload an asset to the release

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate SBOM (CycloneDX)
        run: |
          python -m venv sbom-env
          sbom-env/bin/pip install --upgrade pip
          sbom-env/bin/pip install dist/*.whl cyclonedx-bom
          sbom-env/bin/cyclonedx-py environment \
            --output-format json \
            --output-file sbom.json \
            sbom-env

      - name: Attach SBOM to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No actions/checkout in this job, so there's no .git for gh to
        # infer the repo from - pass it explicitly.
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.json --repo "${{ github.repository }}"
