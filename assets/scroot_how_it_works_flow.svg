<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg"><title>How scroot works</title><desc>Flow from user query through an LLM to a deterministic scoring engine using a factuality classifier and embeddings, producing five metrics and an IQS score that routes to either a feedback store or a passing quality gate.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g><rect x="60" y="36" width="120" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="120" y="56" text-anchor="middle" dominant-baseline="central" fill="#444441" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">User query</text></g>
<g><rect x="240" y="36" width="120" height="40" rx="8" fill="#EEEDF E" stroke="#534AB7" stroke-width="0.5"/><text x="300" y="56" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">LLM / agent</text></g>
<g><rect x="420" y="36" width="120" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="480" y="56" text-anchor="middle" dominant-baseline="central" fill="#444441" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Raw response</text></g>
<line x1="180" y1="56" x2="238" y2="56" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/>
<line x1="360" y1="56" x2="418" y2="56" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/>
<line x1="480" y1="76" x2="480" y2="118" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/>

<g><rect x="60" y="120" width="560" height="118" rx="14" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="340" y="146" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Scoring engine (factuality classifier + embeddings, no LLM call)</text></g>
<g><rect x="80" y="166" width="124" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="142" y="184" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Groundedness</text></g>
<g><rect x="214" y="166" width="120" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="274" y="184" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Completeness</text></g>
<g><rect x="344" y="166" width="104" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="396" y="184" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Relevance</text></g>
<g><rect x="458" y="166" width="142" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="529" y="184" text-anchor="middle" dominant-baseline="central" fill="#185FA5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Consistency + confidence</text></g>
<text x="340" y="222" text-anchor="middle" dominant-baseline="central" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">4.8s p50 on CPU, $0.00 per eval, fully offline</text>
<line x1="340" y1="238" x2="340" y2="266" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5" fill="none"/>

<g><rect x="220" y="268" width="240" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="340" y="288" text-anchor="middle" dominant-baseline="central" fill="#633806" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">IQS score (0 to 1)</text><text x="340" y="308" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Weighted harmonic mean + flags</text></g>

<path d="M260 324 L260 360 L150 360 L150 384" fill="none" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5"/>
<path d="M420 324 L420 360 L530 360 L530 384" fill="none" marker-end="url(#arrow)" stroke="#73726C" stroke-width="1.5"/>
<text x="195" y="350" text-anchor="middle" dominant-baseline="central" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">IQS &lt; threshold</text>
<text x="490" y="350" text-anchor="middle" dominant-baseline="central" fill="#3D3D3A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">IQS ≥ threshold</text>

<g><rect x="50" y="386" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="150" y="406" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Flagged for review</text><text x="150" y="426" text-anchor="middle" dominant-baseline="central" fill="#993C1D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Feedback store, learn</text></g>
<g><rect x="430" y="386" width="200" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="530" y="406" text-anchor="middle" dominant-baseline="central" fill="#27500A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500">Passes quality gate</text><text x="530" y="426" text-anchor="middle" dominant-baseline="central" fill="#3B6D11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Logged as passing</text></g>
</svg>
